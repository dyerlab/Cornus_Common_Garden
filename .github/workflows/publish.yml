name: Build and deploy manuscript site

on:
  push:
    branches: [Main]
    paths:
      - "*.md"
      - "*.meta.yml"
      - "media/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  site:
    uses: dyerlab/manuscript-theme/.github/workflows/render.yml@v1
    with:
      markdown_files: "manuscript.md supplemental.md index.md"
